name: Daily NodeSeek Check-In

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # =======================================================
      # 1. 精准拉取：只拉取私库 NodeSeek 文件夹下的 nodeseek.py 这一个文件
      - name: 📥 拉取私库 nodeseek.py
        uses: actions/checkout@v4
        with:
          repository: walx0705/hosting
          token: ${{ secrets.GH_TOKEN }}
          path: private_repo
          sparse-checkout: NodeSeek/nodeseek.py
      # =======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      # =======================================================
      # 2. 解决上一张截图报错的 /ql 文件夹权限问题
      - name: 🛠️ 修复 /ql 目录权限
        run: |
          sudo mkdir -p /ql
          sudo chmod 777 /ql
      # =======================================================

      # =======================================================
      # 3. 运行拉取下来的私库脚本
      - name: Run check-in
        env:
          NS_COOKIES: ${{ secrets.NS_COOKIES }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          NS_RANDOM: true    # 签到模式：true = 试试手气，false = 固定鸡腿（默认 true）
        run: python private_repo/NodeSeek/nodeseek.py
      # =======================================================

      # =======================================================
      # 4. 清理旧运行记录（加上 --repo 避免找不到 .git 报错）
      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --repo "${{ github.repository }}" --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id --repo "${{ github.repository }}" || true
            fi
          done
      # =======================================================
