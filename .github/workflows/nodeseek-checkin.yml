name: NodeSeek 自动签到

on:
  schedule:
    - cron: '30 8 * * *'   # 北京时间 16:30（UTC 8:30）
  workflow_dispatch:       # 支持手动触发

jobs:
  nodeseek-checkin:
    name: 执行 NodeSeek 签到
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ 检出代码
        uses: actions/checkout@v4

      # =======================================================
      # 1. 精准拉取私库 NodeSeek 文件夹下的 py 和 txt 两个文件
      - name: 📥 拉取私库文件 (nodeseek.py + requirements.txt)
        uses: actions/checkout@v4
        with:
          repository: walx0705/hosting
          token: ${{ secrets.GH_TOKEN }}
          path: private_repo
          sparse-checkout: |
            NodeSeek/nodeseek.py
            NodeSeek/requirements.txt
      # =======================================================

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # =======================================================
      # 2. 修改路径：改为拉取私库里的 requirements.txt 来安装依赖
      - name: ⬇️ 安装依赖
        run: |
          pip install -r private_repo/NodeSeek/requirements.txt
      # =======================================================

      # =======================================================
      # 3. 运行私库里的签到脚本
      - name: 🚀 运行签到脚本
        env:
          NS_COOKIE: ${{ secrets.NS_COOKIE }}
          NS_SIGN_MODE: ${{ secrets.NS_SIGN_MODE || 'chicken' }}
          NS_HEADLESS: ${{ secrets.NS_HEADLESS || 'true' }}
          NS_LOG_LEVEL: ${{ secrets.NS_LOG_LEVEL || 'INFO' }}
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
          PUSH_PLUS_USER: ${{ secrets.PUSH_PLUS_USER }}
          DD_BOT_SECRET: ${{ secrets.DD_BOT_SECRET }}
          DD_BOT_TOKEN: ${{ secrets.DD_BOT_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
        run: |
          python private_repo/NodeSeek/nodeseek.py
      # =======================================================

      # =======================================================
      # 4. 清理旧运行记录
      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --repo "${{ github.repository }}" --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id --repo "${{ github.repository }}" || true
            fi
          done
      # =======================================================
